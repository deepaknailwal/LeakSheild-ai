<!DOCTYPE html>
<html>
<head>
    <title>LeakShield AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;

            /* animated gradient */
            background: linear-gradient(-45deg, #1f4037, #99f2c8, #00c6ff, #0072ff);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🌟 stars layer */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatStar linear infinite;
        }

        @keyframes floatStar {
            from {
                transform: translateY(100vh);
            }
            to {
                transform: translateY(-10vh);
            }
        }

        /* main container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 350px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #00c6ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0072ff;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- stars -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="card">
            <h1>LeakShield AI 🔐</h1>

            <form method="POST" enctype="multipart/form-data">
                <input type="text" name="owner" placeholder="Enter Owner Name" required>
                <input type="file" name="image" required>
                <button type="submit">Upload & Check</button>
            </form>

            <h3>{{ result }}</h3>
            <h2>{{ risk }}</h2>

            {% if image %}
                <img src="{{ url_for('static', filename='uploads/' + image) }}">
            {% endif %}
        </div>
    </div>

    <script>
        const container = document.getElementById("stars");

        for (let i = 0; i < 60; i++) {
            let star = document.createElement("div");
            star.className = "star";

            star.style.left = Math.random() * 100 + "vw";
            star.style.animationDuration = (5 + Math.random() * 5) + "s";
            star.style.opacity = Math.random();

            container.appendChild(star);
        }
    </script>

</body>
</html>
